<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOTI BREW - Only Coffee</title>
<style>
body{margin:0;font-family:system-ui;background:#fdf6ee;padding-bottom:160px}
.top{position:sticky;top:0;background:#fff;padding:12px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #f0e0cc;z-index:10}
.logo{font-weight:900;color:#6b3a22;font-size:20px}
.search{flex:1;background:#fff6e8;border:1px solid #f0e0cc;border-radius:12px;padding:8px 12px;display:flex}
.search input{border:0;outline:0;flex:1;background:transparent}
.pill{background:#6b3a22;color:#fff;padding:6px 12px;border-radius:20px;font-weight:700}
.hero{margin:12px;background:linear-gradient(135deg,#6b3a22,#c89a6a);color:#fff;border-radius:18px;padding:16px}
.grid{padding:0 12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border-radius:16px;border:1px solid #f0e0cc;overflow:hidden;text-align:center;padding-bottom:10px}
.img{height:100px;display:flex;align-items:center;justify-content:center;font-size:45px;background:#fff6e8}
.pr{font-weight:900;color:#6b3a22;font-size:16px}
.btn{background:#6b3a22;color:#fff;border:0;padding:7px 14px;border-radius:9px;font-weight:700;margin-top:6px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #f0e0cc;display:flex;padding:6px 0;z-index:30}
.bn{flex:1;text-align:center;font-size:11px}
.cartBox{position:fixed;bottom:50px;left:0;right:0;background:#fff;border-top:2px solid #6b3a22;padding:12px;z-index:20}
.input{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
</style></head><body>
<div class="top"><div class="logo">👑 MOTI BREW</div><div class="search">🔍<input placeholder="Coffee search..."></div><div class="pill">🛒 <span id="cc">0</span></div></div>
<div class="hero"><b>☕ Only Pure Coffee - Jaipur</b><br>📍 100% Fresh Brew • 30 Mins Delivery</div>

<div class="grid">
<div class="card"><div class="img">☕</div><b>Espresso</b><br><span class="pr">₹99</span><br><button class="btn" onclick="add('Espresso',99)">ADD</button></div>
<div class="card"><div class="img">🔥</div><b>Americano</b><br><span class="pr">₹119</span><br><button class="btn" onclick="add('Americano',119)">ADD</button></div>
<div class="card"><div class="img">🤎</div><b>Cappuccino</b><br><span class="pr">₹149</span><br><button class="btn" onclick="add('Cappuccino',149)">ADD</button></div>
<div class="card"><div class="img">🥛</div><b>Cafe Latte</b><br><span class="pr">₹149</span><br><button class="btn" onclick="add('Latte',149)">ADD</button></div>
<div class="card"><div class="img">✨</div><b>Flat White</b><br><span class="pr">₹159</span><br><button class="btn" onclick="add('Flat White',159)">ADD</button></div>
<div class="card"><div class="img">🧊</div><b>Cold Brew</b><br><span class="pr">₹139</span><br><button class="btn" onclick="add('Cold Brew',139)">ADD</button></div>
<div class="card"><div class="img">⚫</div><b>Black Coffee</b><br><span class="pr">₹89</span><br><button class="btn" onclick="add('Black Coffee',89)">ADD</button></div>
<div class="card"><div class="img">☕</div><b>Filter Coffee</b><br><span class="pr">₹129</span><br><button class="btn" onclick="add('Filter Coffee',129)">ADD</button></div>
</div>

<div class="cartBox">
<div id="cart">🛒 Cart: 0 items | Total: ₹0</div>
<input id="name" class="input" placeholder="👤 Your Name">
<input id="phone" class="input" placeholder="📱 Mobile Number">
<button onclick="order()" style="width:100%;background:#6b3a22;color:#fff;padding:12px;border:0;border-radius:10px;font-weight:900">📲 WhatsApp Order Now</button>
</div>

<div class="nav"><div class="bn">☕<br>Home</div><div class="bn">❤️<br>Wish (0)</div><div class="bn">📦<br>Orders</div><div class="bn">👤<br>You</div></div>

<script>
let items=[],total=0;
function add(n,p){
 items.push(n);
 total+=p;
 document.getElementById("cc").innerText=items.length;
 document.getElementById("cart").innerText="🛒 Cart: "+items.length+" items | Total: ₹"+total;

alert(n+" added to cart");
}
function order(){
 let nm=document.getElementById("name").value,ph=document.getElementById("phone").value;
 if(!nm||!ph){alert("Name aur Mobile bharo");return}
 if(items.length==0){alert("Pehle Coffee ADD karo");return}
 let msg=`☕ MOTI BREW - ONLY COFFEE ORDER
Name: ${nm}
Phone: ${ph}
Items: ${items.join(", ")}
Total Pay: ₹${total}
📍 Jaipur - 30 Mins Delivery`;
 window.open("https://wa.me/916375678964?text="+encodeURIComponent(msg),"_blank");
}
</script>
</body></html>
